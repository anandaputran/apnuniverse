<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>APN Universe</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="gateway">
      <section class="gateway-intro">
        <p class="gateway-eyebrow">Welcome to</p>

        <h1 class="gateway-title">
          <img src="assets/logo-apn-light.webp" alt="APN" class="gateway-logo" />
          <span>UNIVERSE</span>
        </h1>

        <p class="gateway-description">Get to know me, or see how I can help.</p>
      </section>

      <section class="gateway-options">
        <a href="https://anandaputran.github.io/" class="gateway-card">
          <span class="gateway-card-label">Explore</span>

          <div>
            <h2>Portfolio</h2>
            <p>Get to know me.</p>
          </div>
        </a>

        <div class="gateway-card gateway-card--disabled">
          <span class="gateway-card-label">In Development</span>

          <div>
            <h2>Coming Soon</h2>
            <p>Something new is taking shape.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
